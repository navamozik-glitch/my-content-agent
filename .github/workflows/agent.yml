name: Auto Content Generator

on:
  workflow_dispatch: # این خط اجازه می‌دهد دستی هم اجرایش کنی
  schedule:
    - cron: '0 10 * * *' # هر ۲۴ ساعت یک‌بار، ساعت ۱۰ صبح (UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run agent
      env:
        LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      run: python app.py
